<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <style>
    * {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Oxygen,
        Ubuntu,
        Cantarell,
        "Open Sans",
        "Helvetica Neue",
        sans-serif;
      padding: 0px;
      margin: 0px;
    }

    #navbar {
      background-color: rgb(3, 3, 42);
      height: 100px;
    }

    #heading {
      padding-top: 20px;
      padding-left: 50px;
      color: white;
      display: inline-block;
      vertical-align: middle;
    }

    #Tech {
      color: white;
      font-size: 48px;
    }

    #Conf {
      color: rgb(12, 52, 231);
      font-size: 48px;
    }

    #Home {
      padding-top: 30px;
      padding-left: 140px;
      color: white;
      display: inline-block;
      vertical-align: middle;
    }

    #Speaker {
      padding-top: 30px;
      padding-left: 140px;
      color: white;
      display: inline-block;
      vertical-align: middle;
    }

    #Schedule {
      padding-top: 30px;
      padding-left: 140px;
      color: white;
      display: inline-block;
      vertical-align: middle;
    }

    #Register {
      padding-top: 30px;
      padding-left: 140px;
      color: white;
      display: inline-block;
      vertical-align: middle;
    }

    #button {
      padding-top: 20px;
      padding-left: 100px;
      color: white;
      display: inline-block;
      vertical-align: middle;
    }

    #Button-Register {
      background-color: rgb(12, 52, 231);
      padding: 13px 30px;
      border-radius: 10px;
      color: white;
      border: none;
    }

    #Toppest-Line {
      padding-top: 30px;
      color: rgb(12, 52, 231);
      display: inline-block;
      vertical-align: middle;
      font-size: 20px;
      padding-bottom: 20px;
      font-weight: bolder;
    }

    #Heading-1 {
      padding-bottom: 10px;
      font-size: 40px;
    }

    #After-navbar {
      font-family:
        sinar Cambria,
        Cochin,
        Georgia,
        Times,
        "Times New Roman",
        serif;
    }

    #main {
      width: 100%;
    }

    #personal-information {
      margin: 15px;
      border: 1px solid rgb(232, 221, 221);
      height: 570px;
      width: 700px;
      border-radius: 2%;
      display: inline-block;
      vertical-align: top;
    }

    #Personal-information {
      padding-left: 15px;
      color: blue;
      padding-top: 20px;
    }

    #Full-Name {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
      display: block;
    }

    .Full-name {
      margin-left: 30px;
      font-size: 20px;
      display: block;
      padding-top: 5px;
      padding-bottom: 5px;
      border-radius: 10px;
      border: 1px solid rgb(232, 221, 221);
      width: 300px;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 16px;
      color: #1a1a2e;
      display: block;
    }

    #Email {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
      display: block;
    }

    #Phone {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
      display: block;
    }

    #Date_of_Birth {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
      display: block;
    }

    #Gender {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
      display: block;
    }

    .radio {
      transform: scale(1.7);
      margin-left: 20px;
    }

    #radio_2 {
      transform: scale(1.7);
      margin-left: 40px;
    }

    #radio_3 {
      transform: scale(1.7);
      margin-left: 40px;
    }

    #Male {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #Female {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #Other {
      padding-top: 20px;
      padding-bottom: 10px;
      padding-left: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    #Conference_Preference {
      margin: 15px;
      border: 1px solid rgb(232, 221, 221);
      height: 570px;
      width: 700px;
      border-radius: 2%;
      display: inline-block;
      vertical-align: top;
    }

    #DropDown {
      padding-bottom: 5px;
      padding-top: 5x;
      margin-top: 20px;
      margin-bottom: 20px;
      margin-left: 15px;
      font-size: 20px;
    }

    #Textarea {
      padding-bottom: 5px;
      padding-top: 5x;
      margin-top: 20px;
      margin-bottom: 20px;
      margin-left: 15px;
      height: 70px;
      font-size: 20px;
      width: 300px;
    }

    #Last_button {
      margin: 35px;
      height: 100px;
      width: 90%;
      font-size: 30px;
      background-color: blue;
      color: white;
      border-radius: 10px;
      border: none;
    }

    #Account-information {
      margin: 15px;
      border: 1px solid rgb(232, 221, 221);
      height: 420px;
      width: 700px;
      border-radius: 2%;
      display: inline-block;
      vertical-align: top;
    }

    #Additional-information {
      margin: 15px;
      border: 1px solid rgb(232, 221, 221);
      height: 420px;
      width: 700px;
      border-radius: 2%;
      display: inline-block;
      vertical-align: top;
    }
  </style>
</head>

<body>
  <div id="navbar">
    <div id="heading">
    
      <span id="Tech"><b>Tech</b></span><span id="Conf"><b>Conf</b></span>
    
    </div>
    
    <div id="Home"><span>Home</span></div>
    
    <div id="Speaker"><span>Speaker</span></div>
    
    <div id="Schedule"><span>Schedule</span></div>
    
    <div id="Register"><span>Register</span></div>
    
    <div id="button">
    
      <button id="Button-Register">
        <h1>Register Now</h1>
      </button>
    
    </div>
  </div>
  
  <div id="After-navbar">
  
    <center>
      <p id="Toppest-Line">R E G I S T E R &nbsp;&nbsp; N O W</p>
  
      <h1 id="Heading-1">Conference Registration</h1>
  
      <p>
        Fill in the details below to secure your spot at Tech Conference 2026.
      </p>
  
    </center>
  </div>
  
  <br /><br />
  
  <div id="main">
    <div id="personal-information">
      
      <h2 id="Personal-information">Personal Information</h2>
      
      <label id="Full-Name" for="Full-name">Full Name <span style="color: orangered">*</span></label>
      <input type="text" placeholder="  Enter your full name" id="Full-name" class="Full-name" />
      
      <label for="email" id="Email">Email <span style="color: orangered">*</span></label>
      <input name="Female" type="text" placeholder="  Enter your Email " id="email" class="Full-name" />
      
      <label for="phone" id="Phone">Phone <span style="color: orangered">*</span></label>
      <input type="text" placeholder="  +91 XXXXX XXXXX " id="phone" class="Full-name" />
      
      <label id="Date_of_Birth" for="DOB">Date of Birth <span style="color: orangered">*</span></label>
      <input type="date" id="DOB" class="Full-name" />
      
      <label id="Gender">Gender<span style="color: orangered"> *</span></label>
      <input type="radio" id="radio" name="gender" class="radio" class="Full-name" />
      
      <label for="radio" id="Male">Male</label>
      <input type="radio" id="radio_2" name="gender" class="radio" class="Full-name" />
      
      <label for="radio_2" id="Female">Female</label>
      <input type="radio" id="radio_3" name="gender" class="radio" class="Full-name" />
      
      <label for="radio_3" id="Other">Other</label>
    </div>
    <div id="Conference_Preference">

      <h2 id="Personal-information">Conference Preference</h2>

      <label id="Gender">Ticket Type<span style="color: orangered"> *</span></label>
      <input type="radio" id="radioStudent" name="gender" class="radio" />

      <label for="radioStudent" id="Male">Student</label>
      <input type="radio" id="radioProfessional" name="gender" class="radio" />

      <label for="radioProfessional" id="Female">Professional</label>
      <input type="radio" id="VIP" name="gender" class="radio" />
      
      <label for="VIP" id="Other">VIP</label>

      <label id="Gender">Area of Interest<span style="color: orangered"> *</span></label>
      <input type="checkbox" id="radio-Ai" name="gender" class="radio" />
      
      <label for="radio-Ai" id="Male" class="radio">AI</label><br /><br />
      <input type="checkbox" id="radio-Webdev" name="gender" class="radio" />
      
      <label for="radio-Webdev" id="Male" class="radio">Web Development</label><br /><br />
      <input type="checkbox" id="radio-Cloud" name="gender" class="radio" />
      
      <label for="radio-Cloud" id="Male" class="radio">Cloud</label><br /><br />
      <input type="checkbox" id="radio-CS" name="gender" class="radio" />
      
      <label for="radio-CS" class="radio" id="Male">Cyber security</label><br /><br />
      <input type="checkbox" id="radio-DS" name="gender" class="radio" />
      
      <label for="radio-DS" class="radio" id="Male">Data Science</label><br /><br />
      
      <h2 id="Personal-information">Workshop Selection</h2>
      
      <label id="Gender">Select Workshop<span style="color: orangered"> *</span></label>
  
      <select id="DropDown">
        <option disabled selected hidden>
          &nbsp;&nbsp;React Advanced Patterns&nbsp;&nbsp;
        </option>
  
      </select>
    </div>
    
    <div id="Account-information">
  
      <h2 id="Personal-information">Account Information</h2>
  
      <label id="Full-Name" for="Username">Username <span style="color: orangered">*</span></label>
      <input type="text" placeholder="  Choose a username" id="Username" class="Full-name" />
  
      <label id="Email" for="Password">Password <span style="color: orangered">*</span></label>
      <input type="text" placeholder="  ************* " id="Password" class="Full-name" />
  
      <label id="Phone" for="C_password">Confirm Password <span style="color: orangered">*</span></label>
      <input type="text" placeholder="  ************* " id="C_password" class="Full-name" />
    </div>
  
    <div id="Additional-information">
  
      <h2 id="Personal-information">Additional Information</h2>
  
      <label for="Textarea" id="Full-Name">Why do you want to attend this conference?</label>
      <textarea name="" id="Textarea" placeholder="Write your answer here... "></textarea><br />
  
      <input type="checkbox" id="T&C" name="gender" class="radio" />
  
      <label id="Male" for="T&C">I agree to the <span style="color: blue"><a href="https://github.com/SAIMPACT"
            style="color: blue; text-decoration: none;">terms and condition</a></span><span
          style="color: orangered">*</span>
      </label>
  
          <br /><br />
  
          <button id="Last_button">Submit Registration</button>
    </div>
  </div>
</body>

</html>
