<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Caveat;
      }
    </style>
  </head>
  <body>
    <p style="font-size: 40px">Acme Support <br><span style="font-size: 30px">Home &emsp; Help &emsp;Contact</span><hr style="margin-top: -25px; margin-bottom: -25px; width: 90%; margin-left: 0;border: 1px solid black; ;">
    </p>
    <p style="font-size: 40px">Contact Us <br><span style="margin-top: -25px; margin-bottom: -25px; font-size: 25px">Send me a message and we will get back to you</span></p>
    <label style="font-size: 28px; margin-top: -25px; margin-bottom: -25px;" for="Full_name">Full name</label>&emsp;
    <input
      placeholder="Enter your Full name"
      type="text"
      style="width: 300px; height: 30px"
      id="Full_name"
    />
    <br /><br />
    <label style="font-size: 28px" for="Email">Email</label
    >&emsp;&emsp;&emsp;&nbsp;
    <input
      placeholder="Enter your Email"
      type="text"
      style="width: 300px; height: 30px"
      id="Email"
    />
    <br /><br />
    <label style="font-size: 28px" for="Subject">Subject</label
    >&emsp;&emsp;&nbsp;
    <select style="width: 307px; height: 35px" id="Subject" >
      <option value="" disabled selected hidden>Choose a Topic</option>
      <option value="Java">Java</option>
      <option value="Web Dev">Web Dev</option>
      <option value="Maths">Maths</option>
    </select><br><br>
    <label style="font-size: 28px; vertical-align: top;" for="Message">Message</label
    >&emsp;&nbsp;&nbsp;&nbsp;
    <textarea  id="Message" style="width: 300px; height: 100px" ></textarea>
    <p style="font-size: 28px" >How Did you hear about us?</p>
    <input type="radio" name="Refferal" id="Refferal_1">
    <label style="font-size: 28px" for="Refferal_1">Search</label><br>
    <input type="radio" name="Refferal" id="Refferal_2">
    <label style="font-size: 28px" for="Refferal_2">Friend</label><br>
    <input type="radio" name="Refferal" id="Refferal_3">
    <label style="font-size: 28px" for="Refferal_3">Social media</label><br><br>
    <input type="checkbox" id="Product_Name">
    <label style="font-size: 28px" for="Refferal_3">&nbsp;Send me product updates</label><br><br>
    &emsp;<button style="width: 250px; height: 50px; font-size: 20px">Send Message</button>
</body>
</html>
